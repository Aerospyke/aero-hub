; AeroHub settings template (Qt INI format).
; App always loads built-in defaults, then overlays keys present in
; ./aerohub_settings.ini (partial files are OK). If the file is missing, the
; app creates it in the working directory with the full default set.
;
; ROS domain_id: DDS isolation (0–232). Dashboard + core must match.
; ROS namespace: graph path prefix for multi-vehicle. Empty = root (/ah/...).
;   Example: namespace=uav1 → topics /uav1/ah/system/status, node /uav1/ah_dashboard
;   Core must use the same namespace (same INI or AERO_HUB_ROS_NAMESPACE).

[ROS]
domain_id=42
namespace=

; Camera selection owned by ah_core (Task_30). No hard-coded device IDs in code.
; video_source: synthetic | camera
; device_path: synthetic | index:N | /dev/videoN (Linux)
; Prefer path over index when reordering devices (USB / OBS virtual cam).
[Camera]
video_source=synthetic
device_id=-1
device_path=synthetic
backend=

[JSBSim/command_line]
executable=
realtime=--realtime
aircraft=--aircraft=737
;script=
initfile=--initfile=reset00
arg1=--property=propulsion/engine[0]/set-running=1
arg2=--property=propulsion/engine[1]/set-running=1
arg3=--suspend
arg4=
arg5=
arg6=

[JSBSim/ports]
input=5138
output=5139
telnet=5137
flightgear=5508

[JSBSim/rates]
UI=100
output=10
FlightGear=30

[JSBSim/aircraft]
pitch-trim=-0.32
pitch-trim-rate=0.2

[JSBSim/joystick]
elevator-axis=1
aileron-axis=0
rudder-axis=2
throttle-axis=3
aileron-trim-axis=4
elevator-trim-axis=5
axis-0-deadband=0.04
axis-1-deadband=0.04
axis-2-deadband=0.07

[JSBSim/airport]
magvar=12.0
runway-length-ft=11095
ILS-runway-near-latitude=33.937363033
ILS-runway-near-longitude=-118.382713917
ILS-runway-far-latitude=33.933649383
ILS-runway-far-longitude=-118.419018333
ILS-frequency=109.9
ILS-course-mag=251.0
ILS-GS=3.0
ILS-TDZE=97.8
