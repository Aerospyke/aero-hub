; AeroHub settings template (Qt QSettings IniFormat-compatible).
; App always loads built-in defaults, then overlays keys present in
; ./aerohub_settings.ini (partial files are OK). If the file is missing, the
; app creates it in the working directory with the full default set.
;
; Nested groups: top-level [Section], nested path with '\' (QSettings style).
; Example: JSBSim/airport/magvar → [JSBSim] airport\magvar=...
;
; ROS domain_id: DDS isolation (0–232). Dashboard + core must match.
; ROS namespace: graph path prefix for multi-vehicle. Empty = root (/ah/...).
;   Example: namespace=uav1 → topics /uav1/ah/system/status, node /uav1/ah_dashboard
;   Core must use the same namespace (same INI or AERO_HUB_ROS_NAMESPACE).

[ROS]
domain_id=42
namespace=

; Camera selection owned by ah_core (Task_30). No hard-coded device IDs in code.
; video_source: synthetic | camera
; device_path: synthetic | index:N | /dev/videoN (Linux)
; Prefer path over index when reordering devices (USB / OBS virtual cam).
[Camera]
video_source=synthetic
device_id=-1
device_path=synthetic
backend=

[JSBSim]
command_line\executable=
command_line\realtime=--realtime
command_line\aircraft=--aircraft=737
command_line\initfile=--initfile=reset00
command_line\arg1=--property=propulsion/engine[0]/set-running=1
command_line\arg2=--property=propulsion/engine[1]/set-running=1
command_line\arg3=--suspend
command_line\arg4=
command_line\arg5=
command_line\arg6=
ports\input=5138
ports\output=5139
ports\telnet=5137
ports\flightgear=5508
rates\UI=100
rates\output=10
rates\FlightGear=30
aircraft\pitch-trim=-0.32
aircraft\pitch-trim-rate=0.2
joystick\elevator-axis=1
joystick\aileron-axis=0
joystick\rudder-axis=2
joystick\throttle-axis=3
joystick\aileron-trim-axis=4
joystick\elevator-trim-axis=5
joystick\axis-0-deadband=0.04
joystick\axis-1-deadband=0.04
joystick\axis-2-deadband=0.07
airport\magvar=12.0
airport\runway-length-ft=11095
airport\ILS-runway-near-latitude=33.937363033
